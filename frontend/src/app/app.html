<header class="site-header">
  <!-- The name is the alt text, not a caption: it keeps the wordmark readable to
       screen readers and to anyone whose image never arrives. Sites without a
       logo render the name as text instead. -->
  <a class="site-header__wordmark" routerLink="/">
    @if (logo(); as logoUrl) {
      <img class="site-header__logo" [src]="logoUrl | mediaUrl" [alt]="siteName()" />
    } @else {
      {{ siteName() }}
    }
  </a>

  <nav class="site-header__nav">
    <a routerLink="/writings" routerLinkActive="is-active">{{ 'nav.writings' | translate }}</a>
    <!-- Roam is a collective, so its authors are navigation. The personal site's
         top nav is Writings / About / Contact (requirements §3.4). -->
    @if (showAuthors()) {
      <a routerLink="/authors" routerLinkActive="is-active">{{ 'nav.authors' | translate }}</a>
    }
    <a routerLink="/about" routerLinkActive="is-active">{{ 'nav.about' | translate }}</a>
    <a routerLink="/contact" routerLinkActive="is-active">{{ 'nav.contact' | translate }}</a>

    <!-- Renders nothing on a single-language site, and decides for itself when
         a language is unavailable for what is on screen. -->
    <app-language-toggle />
  </nav>
</header>

<main class="site-main">
  <router-outlet />
</main>

<!-- Renders nothing until site-config arrives, and nothing at all for a tenant
     with neither social links nor a name to build a copyright line from. -->
<app-site-footer class="site-footer" />
