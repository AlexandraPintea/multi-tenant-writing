<h1>{{ 'authors.title' | translate }}</h1>
<ul class="authors">
  @for (author of authors(); track author.slug) {
    <li>
      <a [routerLink]="['/authors', author.slug]">{{ author.name }}</a>
      @if (author.location) {
        <span class="authors__location">{{ author.location }}</span>
      }
    </li>
  } @empty {
    <li>{{ 'common.nothingYet' | translate }}</li>
  }
</ul>
