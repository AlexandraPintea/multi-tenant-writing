# Phase one of two. Install this first, get a certificate, then replace it with
# alexandrapintea.eu.conf.
#
# The full config cannot be installed first: it names certificate files, and
# nginx refuses to start when they do not exist, so `nginx -t` fails and certbot
# has no working nginx to work with. This block serves port 80 only, which is
# exactly what the ACME challenge needs.
#
#   sudo mkdir -p /var/www/certbot
#   sudo cp deploy/nginx/alexandrapintea.eu.bootstrap.conf /etc/nginx/sites-available/alexandrapintea.eu.conf
#   sudo ln -s /etc/nginx/sites-available/alexandrapintea.eu.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/certbot \
#        -d alexandrapintea.eu -d www.alexandrapintea.eu
#
# certonly --webroot rather than --nginx: it writes a file and asks Let's
# Encrypt to fetch it, leaving this config alone. --nginx would rewrite the
# file by hand instead, and then the version here and the version running would
# be two different things.
#
# DNS for both names must already point at this machine, or the challenge is
# fetched from whatever the old host is.

server {
    listen 80;
    listen [::]:80;
    server_name alexandrapintea.eu www.alexandrapintea.eu;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "waiting for the certificate\n";
        add_header Content-Type text/plain;
    }
}
