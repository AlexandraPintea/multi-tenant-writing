# alexandrapintea.eu — host nginx, in front of the compose stack.
#
# Phase two. alexandrapintea.eu.bootstrap.conf goes first and gets the
# certificate; this file replaces it once /etc/letsencrypt/live/ exists:
#
#   sudo cp deploy/nginx/alexandrapintea.eu.conf \
#           /etc/nginx/sites-available/alexandrapintea.eu.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Installed in the other order, nginx would refuse to start: it will not load a
# server block naming a certificate file that is not there yet.
#
# roamliterary.com is deliberately absent. It stays on Squarespace for now, and
# a server block here would answer for a domain whose DNS does not point at
# this machine.

server {
    listen 80;
    listen [::]:80;
    server_name alexandrapintea.eu www.alexandrapintea.eu;

    # Left reachable over plain HTTP: this is how Let's Encrypt proves the
    # domain is ours, and it has to keep working at every renewal, not just the
    # first issue.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# www redirects to the bare domain rather than serving it. Django would in fact
# answer on www — SiteMiddleware falls back to DEFAULT_SITE_DOMAIN for a host it
# does not recognise — but then every page would exist at two addresses, with
# canonical tags and Open Graph URLs naming only one of them.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.alexandrapintea.eu;

    ssl_certificate /etc/letsencrypt/live/alexandrapintea.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alexandrapintea.eu/privkey.pem;

    return 301 https://alexandrapintea.eu$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name alexandrapintea.eu;

    ssl_certificate /etc/letsencrypt/live/alexandrapintea.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alexandrapintea.eu/privkey.pem;

    # Both written by certbot on first issue. They carry the cipher suites and
    # protocol versions that get an A at SSL Labs, and keeping them in one
    # place means a future tightening arrives with a certbot upgrade rather
    # than an edit here.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Cover images and the author photo go through the admin, and Django's
    # default upload limit is well above nginx's 1MB. Without this a photo
    # straight off a phone fails as a 413 before Django ever sees it.
    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # These are the only logs on the machine holding reader IP addresses.
    # Ubuntu's logrotate turns /var/log/nginx/* over daily and keeps 14 days,
    # which is the "about two weeks" the privacy notice commits to — check
    # /etc/logrotate.d/nginx still says `rotate 14` if that promise matters.
    access_log /var/log/nginx/alexandrapintea.access.log;
    error_log /var/log/nginx/alexandrapintea.error.log;

    # Uploads, written by the backend container into the bind mount. Served
    # from disk: routing them through Django would spend a Python worker on
    # every image, and with DEBUG off Django refuses to serve them at all.
    location /media/ {
        alias /opt/app/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # The Django admin's own CSS and JS, put here by collectstatic on every
    # container start. The Angular bundle is not in this directory — the SSR
    # container serves its own assets.
    location /static/ {
        alias /opt/app/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;

        # Host is not a formality here. SiteMiddleware resolves the tenant from
        # it, and Django validates it against ALLOWED_HOSTS; $proxy_host — what
        # nginx would send by default — is 127.0.0.1, which is neither.
        proxy_set_header Host $host;
        # Set, not appended: Django trusts this header as proof the request
        # arrived over TLS (SECURE_PROXY_SSL_HEADER), so nginx must overwrite
        # whatever a client tried to send.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Its own block, so the session and CSRF cookies are scoped to /admin/ and
    # are never sent with a public page request.
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Everything else is the reader-facing site, rendered by Node.
    location / {
        proxy_pass http://127.0.0.1:4000;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        # A server render waits on the API; the default 60s is generous, but a
        # hung backend should surface as a 504 rather than a hanging tab.
        proxy_read_timeout 30s;
    }
}
