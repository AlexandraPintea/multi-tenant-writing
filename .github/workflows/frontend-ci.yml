name: frontend-ci

# Same shape as backend-ci: every PR, plus pushes to main so the default branch
# is never left broken by a merge. Path-filtered, because backend-only work has
# no reason to wait on an npm install.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  # The e2e job only. Playwright here means installing a browser, building the
  # app and starting Postgres, Django and the SSR server — minutes per run,
  # against a suite whose failures are as often timing as they are regressions.
  # On every PR that cost buys very little: the unit tests already cover the
  # components, and a flaky red on an unrelated PR teaches people to ignore CI.
  # Nightly, it still catches a broken chain within a day.
  schedule:
    - cron: "0 3 * * *"
  # So the e2e job can be run on demand rather than waiting for 3am.
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  lint-and-test:
    # Nothing to lint on the nightly trigger; the commit has not changed.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          # Relative to the repo root: defaults.working-directory applies to
          # `run` steps, not to action inputs.
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # ci, not install: installs exactly what the lock file records and
        # fails when package.json and the lock disagree.
        run: npm ci

      - name: Lint (prettier + tsc)
        run: npm run lint

      - name: Unit tests (jest)
        run: npm run test -- --coverage

  e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Chromium only, matching the single project in playwright.config.ts.
      # --with-deps pulls the system libraries a headless browser needs on a
      # bare runner.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Development configuration, because the suite talks to the backend on
      # 127.0.0.1:8001 and that address lives in environment.development.ts.
      - name: Build
        run: npm run build -- --configuration development

      # No service container for Postgres here: globalSetup brings up
      # docker-compose.e2e.yml, which owns both the database and a seeded
      # Django. Runners have Docker, and using the same file locally and in CI
      # means a green nightly says something about the developer's machine too.
      - name: Run Playwright
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
