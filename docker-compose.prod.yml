# The deployed stack. Runs on the VPS from /opt/app, reading /opt/app/.env.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# nginx is NOT here: it runs on the host, terminates TLS, and reaches these
# services over loopback. That is why every published port is bound to
# 127.0.0.1 — without the prefix Docker would punch a hole in ufw and publish
# them on the public interface, where the API would be reachable without TLS
# and the admin without a certificate.
#
# Every service caps its logs. Docker's json-file driver is unbounded by
# default, so on a box with 40GB of disk a chatty container is a slow outage.
# Size-based, because that is all the driver offers: 30MB per service, oldest
# chunk dropped first.
#
# Worth being precise about what that does and does not cover, because the
# privacy notice makes a claim about log retention. The reader IP addresses live
# in nginx's access log on the host, which Ubuntu's logrotate turns over daily
# and keeps for 14 days — that is the "about two weeks" the notice describes.
# Django sits behind nginx, so gunicorn's access log records the proxy's address
# rather than the reader's, and holds no personal data to retain.
name: writing

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  db:
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No ports at all. Postgres is reachable only from the other containers on
    # this network, which is the whole of its exposure.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    # Waiting for the database to be *healthy*, not merely started: the
    # entrypoint's first act is a migration, and against a Postgres still
    # opening its socket that fails and takes the container down with it.
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      # Bind mounts rather than named volumes, because host nginx serves both
      # directly and cannot read inside a volume without knowing Docker's
      # internal paths. Both must be owned by uid 1000 on the host — that is
      # the uid the image runs as, and the first upload fails without it.
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    ports:
      - '127.0.0.1:8000:8000'

  frontend:
    build: ./frontend
    restart: unless-stopped
    logging: *logging
    depends_on:
      # Started, not healthy. The backend reports unhealthy until a Site row
      # exists, so on a brand-new database service_healthy would keep the
      # frontend down forever — and the frontend is what one would use to
      # notice. It renders an error page until the API answers, which is the
      # better failure.
      backend:
        condition: service_started
    environment:
      # The whole point of core/internal-api.ts: server renders reach Django
      # across this network instead of going out through public DNS and nginx.
      API_INTERNAL_ORIGIN: http://backend:8000
    ports:
      - '127.0.0.1:4000:4000'

volumes:
  pgdata:
