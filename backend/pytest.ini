[pytest]
# Tests run against Postgres, not in-memory SQLite. The playbook offers SQLite
# as an option and it would be faster, but the suite leans on behaviour that is
# not identical across backends — JSONField lookups on Site.enabled_languages,
# distinct() over the translations join, and NULL ordering on published_at —
# and 1.7 runs CI against a Postgres service container precisely so tests match
# production. A suite that passes on SQLite and fails in CI is worse than a
# slower one. pytest-django creates and drops test_writing_local per run; pass
# --reuse-db locally to keep it between runs.
DJANGO_SETTINGS_MODULE = config.settings.local
python_files = tests.py test_*.py *_test.py
testpaths = tests
addopts = -v