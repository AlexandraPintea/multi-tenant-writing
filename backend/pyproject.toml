[project]
name = "writing-backend"
version = "0.1.0"
requires-python = ">=3.12"
# Pinned with ~= (compatible release): security and bug-fix patches still come
# through, but a minor bump cannot arrive silently. Open lower bounds meant a
# fresh CI install resolved Django 6.1, DRF 3.18 and ruff 0.16 while this venv
# ran 6.0.5, 3.17.1 and 0.15 — so CI was testing a stack nobody develops
# against, and a routine upstream release could break it with no code change.
dependencies = [
    "django~=6.0.5",
    "psycopg2-binary~=2.9.12",
    "python-decouple~=3.8",
    "dj-database-url~=3.1.2",
    "django-parler~=2.4.0",
    "djangorestframework~=3.17.1",
    "django-cors-headers~=4.9.0",
    "Pillow~=12.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.0.3",
    "pytest-django~=4.12.0",
    "model-bakery~=1.24.0",
    # Exact, not ~=: ruff and black decide what "correct" looks like. A new
    # ruff minor adds lint rules and a new black changes formatting output,
    # either of which fails CI on code nobody touched. Upgrading these is a
    # deliberate commit that reformats the tree, never a surprise.
    "ruff==0.15.14",
    "black==26.5.1",
]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["sites_core", "content", "people", "api", "admin_scoped"]

[tool.black]
line-length = 88
target-version = ["py312"]
